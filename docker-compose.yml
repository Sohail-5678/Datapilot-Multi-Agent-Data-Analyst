# Local stack (SPEC §14.7): Postgres + the API. The web app runs with `pnpm dev` in apps/web.
# FAKE_LLM=true works fully offline; put real keys in backend/.env to use the free LLM tiers.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: datapilot
      POSTGRES_DB: datapilot
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:datapilot@postgres:5432/datapilot
      FAKE_LLM: ${FAKE_LLM:-true}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      ALLOWED_ORIGINS: http://localhost:3000
    env_file:
      - path: ./backend/.env
        required: false
    ports: ["10000:10000"]
